# ============================================================
# config.dev.yml — 개발(dev) 환경 설정
#
# 이 파일이 존재하면 앱은 dev 로 동작한다(src/lib/config.ts).
# prd 배포 시 deploy.sh 가 이 파일을 제거해 config.yml(prd)로 전환한다.
#
# 로컬에 직접 설치한 Oracle 접속 정보를 채운다. 값을 비워두면 DB 미연결로
# 간주되어 조회는 빈 결과, 쓰기는 명확한 에러를 반환한다(UI 스모크 테스트 가능).
# ============================================================

db:
  user: "system"
  password: "orcl"
  connectString: "localhost:1521/orcl"

# a / b 는 완전히 독립적이다 — URL·헤더 이름·헤더 값 어느 것도 서로 공유하지
# 않는다. 사이드를 지정하지 않는 실행(단일 실행, 단건 호출)은 전부 a 를 쓴다.
# 즉 a 가 곧 기본 엔드포인트다.
#
# headers 는 그대로 실려 나간다. Content-Type: application/json 은 코드가
# 항상 붙이므로 여기 적지 않는다. name 이 비어 있는 칸은 무시된다.
agent:
  runMode: "stub"           # stub | external
  userId: "pm-test"         # 요청자 사번. 본문의 user_id / CUBE_USER_ID 로 나간다
  timeoutSec: 300            # 호출 1건의 응답 대기 한도(초). 비우면 90
  caseDelaySec: 0           # 호출과 호출 사이 대기(초). 0 = 쉬지 않고 연속 호출.
                            # 케이스 사이는 물론 RAGAS 채점·목적 채우기의 LLM 호출에도 걸린다.
                            # 소수점 가능(0.5 = 500ms). 첫 호출은 기다리지 않는다

  # ── A (기본 엔드포인트) ───────────────────────────────────────
  a:
    url: ""
    headers:
      - name: ""
        value: ""
      - name: ""
        value: ""

  # ── B (비교 대상) ────────────────────────────────────────────
  b:
    url: ""
    headers:
      - name: ""
        value: ""
      - name: ""
        value: ""

# RAGAS 채점 엔진
#   auto     = llm.endpoint 이 있으면 LLM 심판(RAGAS), 없으면 FALLBACK(토큰 겹침)
#   fallback = 항상 FALLBACK
#   ragas    = auto 와 동일(엔드포인트 필요; 없으면 FALLBACK)
ragasEngine: "auto"

# 심판 LLM (OpenAI 호환: base URL + key + model).
#   endpoint 예: http://host:port/v1  (→ /chat/completions 호출)
#   endpoint 를 비우면 LLM 채점이 꺼지고 FALLBACK 으로 동작한다.
llm:
  endpoint: ""
  apiKey: ""
  model: ""

# 임베딩 모델 (OpenAI 호환: base URL + key + model). LLM 과 다른 게이트웨이여도 됨.
#   answer_relevancy 와 answer_correctness 의 의미 유사도 계산에 필요.
#   비우면 그 부분은 건너뛴다(answer_relevancy=null, correctness=F1만).
embedding:
  endpoint: ""
  apiKey: ""
  model: ""

# 에이전트가 부르는 LLM 서버의 API 키. 설정 화면 'LLM 서버' 가 여기 이름을 가리킨다.
#   값은 DB 에 저장되지 않는다 — 호출할 때마다 X-PTX-LLM-KEYS 헤더로만 에이전트에
#   넘어간다 (docs/model-roles-agent.md §1-1). 이름은 영문·숫자·_ 만.
#   값이 빈 항목은 없는 것으로 친다.
llmKeys:
  # VLLM_A_KEY: "sk-..."

# MR Gate — GitLab 에서 targetBranch(prd) 로 오는 MR 에 테스트 이력이 있으면 봇이 승인한다 (docs/gate-design.md).
#   enabled 는 prd 서버에서만 true. dev/로컬은 false 로 둔다 (이중 승인·이중 코멘트 방지).
#   dryRun true 면 approve 하지 않고 "승인 가능" 코멘트만 남긴다. 검증 후 false 로.
#   token/secret 은 이 파일이 리포에 커밋되는 점에 유의 (봇은 해당 프로젝트에만 두고 만료일을 설정).
gate:
  enabled: false
  dryRun: true
  comment: true             # false = MR 코멘트 없이 로그만
  intervalSec: 300          # tick 주기(초). 최소 30
  secret: ""                # webhook(X-Gitlab-Token) / 수동 실행(X-Gate-Secret) 공유 시크릿
  gitlab:
    baseUrl: ""             # 예: https://gitlab.example.com
    token: ""               # 봇 계정 Project Access Token (api scope)
    timeoutSec: 15
  projects:                 # 지금은 1개. datasetId 가 0/빈 id 인 항목은 무시된다
    - gitlabProjectId: ""   # 숫자 ID 또는 URL-encoded path
      sourceBranch: ""        # 비우면 targetBranch 로 오는 모든 MR 이 대상. 값을 주면 그 브랜치에서 온 MR 만
      targetBranch: "prd"
      datasetId: 0
