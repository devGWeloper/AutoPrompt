<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- inview 파비콘과 같은 짜임: 둥근 타일 + 옅은 눈금 + 표식 + 노드 점.
       타일은 사이드바 브랜드 마크와 같은 blue→violet 그라데이션을 쓴다
       (inview 상단바 .brand .logo 와 동일한 그라데이션). -->
  <defs>
    <linearGradient id="tx" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tx)"/>
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round">
    <line x1="6" y1="9"  x2="26" y2="9"/>
    <line x1="6" y1="13" x2="26" y2="13"/>
    <line x1="6" y1="17" x2="26" y2="17"/>
    <line x1="6" y1="21" x2="26" y2="21"/>
    <line x1="6" y1="25" x2="26" y2="25"/>
  </g>
  <!-- 문자 X 비율: 가로보다 세로가 길다 -->
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
    <line x1="10" y1="8"  x2="22" y2="24"/>
    <line x1="22" y1="8"  x2="10" y2="24"/>
  </g>
  <g fill="#ffffff">
    <circle cx="10" cy="8"  r="1.6"/>
    <circle cx="22" cy="8"  r="1.6"/>
    <circle cx="16" cy="16" r="1.8"/>
    <circle cx="10" cy="24" r="1.6"/>
    <circle cx="22" cy="24" r="1.6"/>
  </g>
</svg>
