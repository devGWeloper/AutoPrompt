# ============================================================
# config.yml — 운영(prd) 환경 설정
#
# 로딩 규칙 (src/lib/config.ts)
#   - config.dev.yml 이 있으면 dev 로 동작
#   - 없으면 이 파일이 사용되며 appEnv = prd
#   prd 배포에서는 deploy.sh 가 config.dev.yml 을 제거합니다.
#
# db: PTX 소유 테이블(PTX_*)이 들어있는 Oracle 접속 정보.
#   connectString 예: host:port/service  ex) 10.0.0.10:1521/XEPDB1
#   값을 비워두면 DB 미연결로 간주(조회는 빈 결과 / 쓰기는 명확한 에러).
# ============================================================

db:
  user: ""
  password: ""
  connectString: ""

# 외부 채팅/슈퍼에이전트 연동 (flow-level RAGAS 답변 생성).
#   runMode=external 이면 baseUrl 로 실제 채팅 엔드포인트를 호출,
#   기본 stub 이면 결정론적 placeholder 답변으로 동작한다.
#   비교(A/B)에서 두 버전이 서로 다른 API 에 떠 있으면 baseUrlA / baseUrlB 를 나눠 넣는다.
agent:
  runMode: "stub"           # stub | external
  baseUrl: ""               # 공용 기본 엔드포인트 (아래 A/B 가 비면 이 값을 쓴다)
  baseUrlA: ""              # 비교 A 쪽 기본 엔드포인트 (단일 실행/단건 호출도 A 를 쓴다)
  baseUrlB: ""              # 비교 B 쪽 기본 엔드포인트
  protocol: "chat"          # 공용 요청 형식. chat = {message,…} / gaia = {query, gaia_*, request_url,…}
  protocolA: ""             # A 쪽 요청 형식 (비우면 위 protocol)
  protocolB: ""             # B 쪽 요청 형식 (비우면 위 protocol)
  rpcMethod: "message/send" # protocol=gaia 일 때 JSON-RPC method 이름
  authKey: ""               # 공용 인증 키 (아래 A/B 가 비면 이 값)
  authKeyA: ""              # A 쪽 인증 키
  authKeyB: ""              # B 쪽 인증 키
  userId: "pm-test"
  authHeader: "auth-key"
  userHeader: "user-id"

# RAGAS 채점 엔진: auto(llm 있으면 LLM 심판, 없으면 FALLBACK) | fallback | ragas
ragasEngine: "auto"

# 심판 LLM (OpenAI 호환). endpoint 예: http://host:port/v1 (→ /chat/completions)
# 비우면 LLM 채점이 꺼지고 FALLBACK 으로 동작한다.
llm:
  endpoint: ""
  apiKey: ""
  model: ""

# 임베딩 모델 (OpenAI 호환). answer_relevancy / answer_correctness 유사도에 필요.
embedding:
  endpoint: ""
  apiKey: ""
  model: ""
